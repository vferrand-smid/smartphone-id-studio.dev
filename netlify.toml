 [build]
   command = "npm run build"
   publish = "dist"

  [build.environment]
    NODE_VERSION = "20.19.0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Redirections spécifiques, si nécessaire
[[redirects]]
  from = "/old-page"
  to = "/new-page"
  status = 301
